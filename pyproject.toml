[project]
name = "plumelens-engine"
version = "0.7.6"
description = "PlumeLens Python backend - hybrid ONNX + torch bird photo analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.132.0",
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.22.0",
    "onnxruntime>=1.25.0",
    "numpy>=2.0.0",
    "pillow>=12.0.0",
    "rawpy>=0.23.0",
    "pyarrow>=18.0.0",
    "pydantic-settings>=2.13.0",
    "structlog>=25.0.0",
    # 场景分组：AKAZE 特征匹配 + HSV/LAB 颜色直方图（lingjian-v2 算法）
    "opencv-python-headless>=4.10.0",
    # DINOv3 species v4：torch + transformers 直接 inference（safetensors backbone +
    # LoRA/reject adapter）。原 ONNX 路线已验证不可行（RoPE fp16 NaN + CoreML EP ViT 覆盖差，
    # 转 ONNX 后准确率显著下降）。bf16 on MPS/CUDA, fp32 on CPU。
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.57.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "httpx>=0.28.0",
    "pyinstaller>=6.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["engine"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests/engine"]
asyncio_mode = "auto"
