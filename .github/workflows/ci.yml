name: CI Quality & Web E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  UV_LOCKED: 'true'
  UV_HTTP_TIMEOUT: '600'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Type, lint, unit & Web E2E checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --extra dev

      - name: Frontend static checks, unit tests & production build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Backend static checks & unit tests
        run: |
          uv run ruff check .
          uv run pyright
          uv run pytest -m "not integration"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Web Playwright E2E
        run: npm run test:e2e

      - name: Upload Web E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-diagnostics-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
