name: macOS App Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 120

    env:
      PLUMELENS_FORCE_ENGINE_BUILD: '1'
      MODEL_BUNDLE_URL: ${{ secrets.PLUMELENS_MODELS_URL }}
      MODEL_RELEASE_TAG: ${{ vars.PLUMELENS_MODELS_RELEASE_TAG || 'models-v3' }}
      MODEL_RELEASE_ASSET: ${{ vars.PLUMELENS_MODELS_RELEASE_ASSET || 'plumelens-models-v3.tar.gz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          npm ci
          uv sync --extra dev
          uv run pyinstaller --version

      - name: Restore private model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bundle="/tmp/plumelens-models"
          extract_dir="/tmp/plumelens-models-extract"
          mkdir -p "$extract_dir"

          if [[ -n "${MODEL_BUNDLE_URL}" ]]; then
            case "${MODEL_BUNDLE_URL}" in
              *.zip) bundle="${bundle}.zip" ;;
              *.tar) bundle="${bundle}.tar" ;;
              *.tar.gz|*.tgz) bundle="${bundle}.tar.gz" ;;
              *) bundle="${bundle}.tar.gz" ;;
            esac
            curl --fail --location --retry 3 --output "$bundle" "${MODEL_BUNDLE_URL}"
          elif [[ -n "${MODEL_RELEASE_TAG}" ]]; then
            bundle="/tmp/${MODEL_RELEASE_ASSET}"
            gh release download "${MODEL_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${MODEL_RELEASE_ASSET}" \
              --output "$bundle"
          else
            echo "::error::Missing model assets. Set secret PLUMELENS_MODELS_URL, or set repository variables PLUMELENS_MODELS_RELEASE_TAG and PLUMELENS_MODELS_RELEASE_ASSET."
            exit 1
          fi

          case "$bundle" in
            *.zip) ditto -x -k "$bundle" "$extract_dir" ;;
            *.tar) tar -xf "$bundle" -C "$extract_dir" ;;
            *.tar.gz|*.tgz) tar -xzf "$bundle" -C "$extract_dir" ;;
            *) echo "::error::Unsupported model bundle format: $bundle"; exit 1 ;;
          esac

          if [[ -d "$extract_dir/engine/models" ]]; then
            rsync -a "$extract_dir/engine/models/" engine/models/
          elif [[ -d "$extract_dir/models" ]]; then
            rsync -a "$extract_dir/models/" engine/models/
          else
            rsync -a "$extract_dir/" engine/models/
          fi

          rm -rf "$bundle" "$extract_dir"

      - name: Validate packaged model assets
        run: |
          set -euo pipefail

          # v0.6.0+ 模型清单:
          # - DINOv4 species:species_list_1301 已删,heads/seed*.pt 已替换为 v4 LoRA
          #   单文件 adapter,新增 v4/seed42_adapter.pt + v4_calibration_policy.json
          # - bird_visibility v2.0 (11 关键点):bird_visibility.onnx 已升级为
          #   bird_visibility11.onnx + bird_visibility11_config.json (含 best_body /
          #   best_tail / best_wings 校准段)。
          required=(
            "engine/models/yolo26l-bird-det.onnx"
            "engine/models/bird_visibility11.onnx"
            "engine/models/clipiqa_plus.onnx"
            "engine/models/hyperiqa.onnx"
            "engine/models/bird_visibility11_config.json"
            "engine/models/species/backbone/config.json"
            "engine/models/species/backbone/model.safetensors"
            "engine/models/species/canonical_extended.parquet"
            "engine/models/species/v4_calibration_policy.json"
            "engine/models/species/v4/seed42_adapter.pt"
            "engine/models/species_wiki.parquet"
          )

          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing required model asset: $file"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify model manifest SHA-256
        # 供应链整完整性闸门 — 把打包前模型文件的 SHA-256 与 git-tracked
        # engine/models/manifest.json 比对,任一不一致直接 fail build。
        # 拦截两类风险:(1) Release tarball 被中间人替换,(2) 仓库内 manifest
        # 被篡改但未同步真实模型(开发期忘记重跑 build_model_manifest.py)。
        # 引擎运行时也会做同样校验(engine/core/manifest.py),CI 这一步是双保险。
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from engine.core.manifest import ManifestError, verify_manifest

          try:
              verified = verify_manifest(Path("engine/models"))
          except ManifestError as exc:
              raise SystemExit(f"::error::{exc}") from exc
          print(f"manifest verified: {len(verified)} entries")
          PY

      - name: Build macOS DMG
        run: npm run dist:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlumeLens-macOS-arm64-${{ github.sha }}
          path: release/PlumeLens-*-arm64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          dmg="$(ls release/PlumeLens-*-arm64.dmg | head -n 1)"

          # 算 SHA-256 + 写 sidecar — 用户下载后可对照校验。
          # 这是 release tarball 中间人篡改的最直接抵抗:GitHub 即使被入侵推
          # 篡改 DMG,sha256 文件和 release notes 内的 hash 不会自动跟着改
          # (release notes 是这次 publish 的 commit 内容)。
          dmg_basename="$(basename "$dmg")"
          sha256_value="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          sha256_path="${dmg}.sha256"
          printf '%s  %s\n' "$sha256_value" "$dmg_basename" > "$sha256_path"

          cat > release-notes.md <<EOF
          ## PlumeLens ${version}

          鉴翎 0.6.0 继续面向真实选片工作流打磨稳定性，重点补齐源文件夹失联重关联、导出链路、羽迹地理分布、深度复核和性能体验。

          ### 主要更新

          - 导出功能落地：支持多文件夹并行导出、右侧浮窗进度、收起后继续导出、合并导出与按评级分类导出。
          - 源文件夹失联保护：源目录改名或移动后保留缓存与筛选结果，支持重新关联新路径。
          - JPG/RAW 同步导出：优先复制主文件，并自动携带 RAW companion。
          - 中文导出报告：manifest / CSV / 目录命名使用中文口径与文件夹别名。
          - 羽迹地理分布重做：只统计有效入羽迹照片，按物理地点合并，地点详情支持鸟种筛选。
          - 深度复核增强：固定分数区域、倍率选择、全屏查看、拖动与点击放大。
          - 队列稳定性修复：暂停/取消不再破坏 processing 状态，多 worker 取任务改为原子语义。
          - 缩略图可靠性修复：空缩略图自动重建并带本地缓存刷新。
          - 外部编辑增强：Topaz / Photoshop 识别与启动路径更稳。
          - 启动状态增强：展示 CPU / GPU / MPS / Mixed 推理设备状态。
          - 性能优化：大列表虚拟化、地图按需加载、后端分页接口与缩略图修复队列。
          - 版本更新：应用、Python 后端、FastAPI 均更新到 0.6.0。

          ### 自动构建

          - 本 Release 由 GitHub Actions 的 macOS arm64 自动构建流程生成。
          - Windows 自动构建暂时停用。

          ### 校验

          - 本地已通过 ruff、pyright、pytest、typecheck、lint、vitest、Playwright 与 macOS DMG 打包校验。
          - Actions Release 产物会在构建过程中完成模型资产校验、PyInstaller 后端冻结、Electron 打包、codesign 校验与 DMG 内容校验。

          ### DMG 校验

          下载 \`${dmg_basename}\` 后,本地比对 SHA-256:

          \`\`\`bash
          shasum -a 256 ${dmg_basename}
          # 应与下方完全一致(也可直接下载 ${dmg_basename}.sha256 调 \`shasum -a 256 -c\` 自动校验)
          # ${sha256_value}
          \`\`\`
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "PlumeLens ${version}" --notes-file release-notes.md
          else
            gh release create "$tag" --title "PlumeLens ${version}" --notes-file release-notes.md
          fi
          gh release upload "$tag" "$dmg" "$sha256_path" --clobber
