name: macOS App Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Keep tests and the frozen backend on the same supported Python ABI.
  PYTHON_VERSION: '3.11'
  UV_LOCKED: 'true'
  UV_HTTP_TIMEOUT: '600'

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & verify macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 75

    env:
      MODEL_BUNDLE_URL: ${{ secrets.PLUMELENS_MODELS_URL }}
      MODEL_RELEASE_TAG: ${{ vars.PLUMELENS_MODELS_RELEASE_TAG || 'models-v4' }}
      MODEL_RELEASE_ASSET: ${{ vars.PLUMELENS_MODELS_RELEASE_ASSET || 'plumelens-models-v4.tar.gz' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Cache Electron & electron-builder archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: mac-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-electron-

      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked --extra dev
          uv run python --version
          uv run pyinstaller --version

      - name: Run macOS-specific unit tests
        run: |
          uv run pytest \
            tests/engine/test_services/test_exporter_atomic.py \
            tests/engine/test_pipeline/test_runtime.py

      - name: Restore & verify reviewed model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The reviewed checkout is the trust root, never the downloaded bundle.
          cp engine/models/manifest.json "$RUNNER_TEMP/plumelens-trusted-manifest.json"

          bundle="$RUNNER_TEMP/plumelens-models"
          if [[ -n "${MODEL_BUNDLE_URL}" ]]; then
            curl --fail --location --retry 3 --connect-timeout 30 --max-time 600 \
              --output "$bundle" "${MODEL_BUNDLE_URL}"
          elif [[ -n "${MODEL_RELEASE_TAG}" ]]; then
            bundle="$RUNNER_TEMP/${MODEL_RELEASE_ASSET}"
            gh release download "${MODEL_RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${MODEL_RELEASE_ASSET}" \
              --output "$bundle"
          else
            echo "::error::Missing model assets. Set secret PLUMELENS_MODELS_URL, or set repository variables PLUMELENS_MODELS_RELEASE_TAG and PLUMELENS_MODELS_RELEASE_ASSET."
            exit 1
          fi

          uv run python scripts/restore_models.py --archive "$bundle" \
            --trusted-manifest "$RUNNER_TEMP/plumelens-trusted-manifest.json" \
            --require-tracked
          rm -f "$bundle"

      - name: Run real-model pipeline integration tests
        run: uv run pytest -m integration

      - name: Build macOS DMG
        run: npm run dist:mac:bundle

      - name: Smoke test mounted DMG application
        run: |
          set -euo pipefail
          dmg="$(ls release/PlumeLens-*-arm64.dmg | head -n 1)"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/plumelens-dmg-smoke.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" -force >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          app_bin="$mount_dir/PlumeLens.app/Contents/MacOS/PlumeLens"
          test -x "$app_bin"

          uv run --no-sync python tests/e2e-electron/fixtures/generate_photos.py
          PLUMELENS_APP_PATH="$app_bin" npx playwright test \
            --config=tests/e2e-electron/playwright.config.ts \
            cold-start.spec.ts packaged-smoke.spec.ts

      - name: Upload packaged E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-e2e-diagnostics-mac-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate DMG SHA-256 & upload artifact
        run: |
          set -euo pipefail
          dmg="$(ls release/PlumeLens-*-arm64.dmg | head -n 1)"
          dmg_basename="$(basename "$dmg")"
          sha256_value="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256_value" "$dmg_basename" > "${dmg}.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PlumeLens-macOS-arm64-${{ github.sha }}
          path: |
            release/PlumeLens-*-arm64.dmg
            release/PlumeLens-*-arm64.dmg.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
