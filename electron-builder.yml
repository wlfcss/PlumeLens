appId: com.plumelens.app
productName: PlumeLens
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!out/**/*.tsbuildinfo"
  - "!out/**/*.map"
  # renderer 与 main/preload 均已 bundle；交付包不带开发期 node_modules。

# Mac dmg 内部布局：
#   PlumeLens.app/Contents/Resources/
#     ├── plumelens-engine/        ← PyInstaller 产物（含 binary + _internal/）
#     │   ├── plumelens-engine
#     │   └── _internal/           （含 torch/transformers/onnxruntime 各 native lib）
#     └── models/                  ← 推理模型 + 配套 metadata
#         ├── yolo26l-bird-det.onnx
#         ├── bird_visibility.onnx
#         ├── clipiqa_plus.onnx
#         ├── hyperiqa.onnx
#         ├── bird_visibility_config.json
#         ├── species_wiki.parquet
#         └── species/             ← v4 DINOv3 species（torch + transformers）
#             ├── backbone/
#             │   ├── config.json
#             │   └── model.safetensors      （fp16 ~580MB）
#             ├── v4/
#             │   └── seed42_adapter.pt       （LoRA + species/reject head ~32MB）
#             ├── canonical_extended.parquet  （1591 类元数据）
#             └── v4_calibration_policy.json  （recognized / uncertain / unrecognized 三态阈值）
extraResources:
  - from: dist/plumelens-engine
    to: plumelens-engine
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  - from: engine/models
    to: models
    filter:
      - "*.onnx"
      - "*.parquet"
      - "*.json"
  # species v4 的子目录（safetensors backbone + LoRA adapter + parquet/json）单独捞。
  # **/* 是全包，因此显式排除开发期临时产物，避免 .bak/缓存文件意外进 DMG。
  - from: engine/models/species
    to: models/species
    filter:
      - "**/*"
      - "!**/.DS_Store"
      - "!**/__pycache__/**"
      - "!**/*.bak"
      - "!**/*.tmp"
mac:
  # target 用 dir：electron-builder 的 dmg-builder 在打包时**丢失 Electron Framework
  # binary**（157MB 的核心库），导致从 dmg 装机后启动 dyld 报 Library missing。
  # 我们在 afterAllArtifactBuild 里用系统 hdiutil 自己打 dmg（保留所有文件 + 签名）。
  target: dir
  category: public.app-category.photography
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
beforePack: scripts/build-engine.cjs
afterPack: scripts/codesign-mac.cjs
afterAllArtifactBuild: scripts/build-dmg.cjs
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
