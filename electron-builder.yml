appId: com.plumelens.app
productName: PlumeLens
toolsets:
  # The legacy cross-platform archive contains macOS symlinks that require
  # elevated privileges to extract on Windows. Use the Windows-specific tools.
  winCodeSign: '1.1.0'
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - '!out/**/*.tsbuildinfo'
  - '!out/**/*.map'
  # Frontend dependencies are already bundled; main/preload use Electron and
  # Node built-ins. Avoid shipping a second copy of ECharts and the fonts.
  - '!node_modules/**/*'
  # renderer 与 main/preload 均已 bundle；交付包不带开发期 node_modules。

# Mac dmg 内部布局：
#   PlumeLens.app/Contents/Resources/
#     ├── plumelens-engine/        ← PyInstaller 产物（含 binary + _internal/）
#     │   ├── plumelens-engine
#     │   └── _internal/           （含 torch/transformers/onnxruntime 各 native lib）
#     └── models/                  ← 推理模型 + 配套 metadata
#         ├── yolo26l-bird-det.onnx
#         ├── bird_visibility11.onnx          （v2.0,11 关键点 pose）
#         ├── bird_flight_classifier.onnx     （v1,飞版/非飞版分类）
#         ├── clipiqa_plus.onnx
#         ├── hyperiqa.onnx
#         ├── bird_visibility11_config.json   （含 best_body/tail/wings 校准）
#         ├── species_wiki.parquet
#         └── species/             ← v4 DINOv3 species（torch + transformers）
#             ├── backbone/
#             │   ├── config.json
#             │   └── model.safetensors      （fp16 ~580MB）
#             ├── v4/
#             │   └── seed42_adapter.pt       （LoRA + species/reject head ~32MB）
#             ├── canonical_extended.parquet  （1591 类元数据）
#             └── v4_calibration_policy.json  （recognized / uncertain / unrecognized 三态阈值）
#     └── species-artwork/          ← 羽迹物种封面图,运行时离线读取
extraResources:
  - from: dist/plumelens-engine
    to: plumelens-engine
    filter:
      - '**/*'
      - '!**/.DS_Store'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: engine/models
    to: models
    filter:
      - '*.onnx'
      - '*.parquet'
      - '!species_wiki.parquet'
      - '*.json'
  # species v4 的子目录（safetensors backbone + LoRA adapter + parquet/json）单独捞。
  # **/* 是全包，因此显式排除开发期临时产物，避免 .bak/缓存文件意外进 DMG。
  - from: engine/models/species
    to: models/species
    filter:
      - '**/*'
      - '!**/.DS_Store'
      - '!**/__pycache__/**'
      - '!**/*.bak'
      - '!**/*.tmp'
  - from: resources/species-artwork
    to: species-artwork
    filter:
      - '*.webp'
      - 'manifest.json'
      - 'THIRD_PARTY_ATTRIBUTIONS.md'
  - from: LICENSE
    to: LICENSE
mac:
  # PyTorch 2.14+ MPS requires macOS 14 (Sonoma) or later (Electron 45+ requires macOS 13+).
  minimumSystemVersion: '14.0'
  # target 用 dir：electron-builder 的 dmg-builder 在打包时**丢失 Electron Framework
  # binary**（157MB 的核心库），导致从 dmg 装机后启动 dyld 报 Library missing。
  # 我们在 afterAllArtifactBuild 里用系统 hdiutil 自己打 dmg（保留所有文件 + 签名）。
  target: dir
  category: public.app-category.photography
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
beforePack: scripts/build-engine.cjs
afterPack: scripts/after-pack.cjs
afterAllArtifactBuild: scripts/build-dmg.cjs
win:
  extraFiles:
    - from: prepare-windows-gpu.cmd
      to: prepare-windows-gpu.cmd
    - from: WINDOWS.md
      to: WINDOWS.md
    - from: LICENSE
      to: LICENSE
  # AMD runtime + model archive exceeds NSIS's 2 GiB embedded-data limit.
  # ZIP64 supports the complete offline runtime and needs no installation.
  target: zip
  artifactName: '${productName}-${version}-Windows-${arch}.${ext}'
  icon: build/icon.ico
  # Branding is applied in after-pack without the legacy privileged archive.
  # This local build is unsigned; release signing can run after resource editing.
  signAndEditExecutable: false
