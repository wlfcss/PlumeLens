appId: com.plumelens.app
productName: PlumeLens
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  # main 进程 externalizeDepsPlugin 把 dependencies (如 @electron-toolkit/utils) 留作
  # runtime require → 必须把它们打进 app.asar/node_modules。renderer 已 bundle 不需要。
  - "node_modules/@electron-toolkit/**"

# Mac dmg 内部布局：
#   PlumeLens.app/Contents/Resources/
#     ├── plumelens-engine/        ← PyInstaller 产物（含 binary + _internal/）
#     │   ├── plumelens-engine
#     │   └── _internal/
#     └── models/                  ← ONNX 模型 + 配套 parquet/json
#         ├── yolo26l-bird-det.onnx
#         ├── bird_visibility.onnx
#         ├── clipiqa_plus.onnx
#         ├── hyperiqa.onnx
#         ├── dinov3_backbone.onnx
#         ├── species_ensemble.onnx
#         ├── species_taxonomy.parquet
#         ├── species_trained.json
#         ├── species_wiki.parquet
#         └── bird_visibility_config.json
extraResources:
  - from: dist/plumelens-engine
    to: plumelens-engine
    filter:
      - "**/*"
  - from: engine/models
    to: models
    filter:
      - "*.onnx"
      - "*.parquet"
      - "*.json"
mac:
  target: dmg
  category: public.app-category.photography
  # electron-builder 内置 ad-hoc (identity '-') 在 osx-sign 子依赖里有 bug，
  # 构建过程会 RangeError: Invalid array length。改在打包后用 codesign 命令手动
  # ad-hoc 签整个 .app（含 Frameworks/PyInstaller binaries），脚本：scripts/codesign-mac.sh
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
afterPack: scripts/codesign-mac.cjs
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
