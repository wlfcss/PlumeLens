appId: com.plumelens.app
productName: PlumeLens
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  # main 进程 externalizeDepsPlugin 把 dependencies (如 @electron-toolkit/utils) 留作
  # runtime require → 必须把它们打进 app.asar/node_modules。renderer 已 bundle 不需要。
  - "node_modules/@electron-toolkit/**"

# Mac dmg 内部布局：
#   PlumeLens.app/Contents/Resources/
#     ├── plumelens-engine/        ← PyInstaller 产物（含 binary + _internal/）
#     │   ├── plumelens-engine
#     │   └── _internal/           （含 torch/transformers/onnxruntime 各 native lib）
#     └── models/                  ← 推理模型 + 配套 metadata
#         ├── yolo26l-bird-det.onnx
#         ├── bird_visibility.onnx
#         ├── clipiqa_plus.onnx
#         ├── hyperiqa.onnx
#         ├── bird_visibility_config.json
#         ├── species_wiki.parquet
#         └── species/             ← v3 DINOv3 species（torch + transformers）
#             ├── backbone/
#             │   ├── config.json
#             │   └── model.safetensors      （fp16 ~580MB）
#             ├── heads/
#             │   ├── seed42.pt … seed2024.pt （8 个 head ckpt，每个 ~33MB）
#             ├── canonical_extended.parquet  （1535 类元数据）
#             └── species_list_1301.parquet   （trained 1301 类的 model_output_id）
extraResources:
  - from: dist/plumelens-engine
    to: plumelens-engine
    filter:
      - "**/*"
  - from: engine/models
    to: models
    filter:
      - "*.onnx"
      - "*.parquet"
      - "*.json"
  # species v3 的子目录（safetensors backbone + 8 head .pt + parquet）单独捞
  - from: engine/models/species
    to: models/species
    filter:
      - "**/*"
mac:
  # target 用 dir：electron-builder 的 dmg-builder 在打包时**丢失 Electron Framework
  # binary**（157MB 的核心库），导致从 dmg 装机后启动 dyld 报 Library missing。
  # 我们在 afterAllArtifactBuild 里用系统 hdiutil 自己打 dmg（保留所有文件 + 签名）。
  target: dir
  category: public.app-category.photography
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
afterPack: scripts/codesign-mac.cjs
afterAllArtifactBuild: scripts/build-dmg.cjs
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
