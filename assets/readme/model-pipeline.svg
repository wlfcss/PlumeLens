<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PlumeLens model pipeline</title>
  <desc id="desc">A visual overview of the local hybrid inference pipeline used by PlumeLens.</desc>
  <rect width="1280" height="560" rx="28" fill="#050505"/>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1b1b1b" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { fill: #8b8b8b; font: 500 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .title { fill: #f6f6f6; font: 700 34px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #bdbdbd; font: 500 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-title { fill: #f8f8f8; font: 700 23px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-small { fill: #a8a8a8; font: 500 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #e6e6e6; font: 650 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tag { fill: #101010; font: 700 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .number { fill: #050505; font: 800 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="560" fill="url(#grid)" opacity=".55"/>
  <path d="M996 -60C1130 16 1202 118 1215 246C1228 374 1175 475 1058 548" stroke="#202020" stroke-width="96" opacity=".45"/>
  <circle cx="1070" cy="105" r="5" fill="#74F69C" filter="url(#soft-glow)"/>
  <circle cx="1125" cy="395" r="5" fill="#FFD45A" filter="url(#soft-glow)"/>
  <circle cx="196" cy="472" r="5" fill="#FF4D4D" filter="url(#soft-glow)"/>

  <text x="64" y="68" class="eyebrow">LOCAL HYBRID INFERENCE</text>
  <text x="64" y="112" class="title">从一张照片到可审阅的鸟类结果</text>
  <text x="64" y="146" class="subtitle">检测、姿态、画质与鸟种识别在本机串联运行，输出分级、物种候选与复核证据。</text>

  <g transform="translate(64 210)">
    <rect x="0" y="0" width="190" height="210" rx="20" fill="url(#panel)" stroke="#2a2a2a"/>
    <circle cx="28" cy="30" r="13" fill="#f6f6f6"/><text x="23" y="36" class="number">1</text>
    <text x="24" y="74" class="card-title">导入原片</text>
    <text x="24" y="108" class="card-small">RAW / JPEG / EXIF</text>
    <text x="24" y="136" class="card-small">只读扫描源目录</text>
    <text x="24" y="164" class="mono">Pillow / rawpy</text>
    <rect x="24" y="178" width="88" height="24" rx="12" fill="#74F69C"/><text x="39" y="195" class="tag">metadata</text>
  </g>

  <path d="M268 315H326" stroke="#595959" stroke-width="2"/><path d="M326 315L315 307V323L326 315Z" fill="#595959"/>

  <g transform="translate(334 210)">
    <rect x="0" y="0" width="190" height="210" rx="20" fill="url(#panel)" stroke="#2a2a2a"/>
    <circle cx="28" cy="30" r="13" fill="#f6f6f6"/><text x="23" y="36" class="number">2</text>
    <text x="24" y="74" class="card-title">鸟类检测</text>
    <text x="24" y="108" class="card-small">找出画面中的鸟</text>
    <text x="24" y="136" class="mono">YOLOv26l</text>
    <text x="24" y="164" class="card-small">1280 letterbox</text>
    <rect x="24" y="178" width="70" height="24" rx="12" fill="#FFD45A"/><text x="41" y="195" class="tag">bbox</text>
  </g>

  <path d="M538 315H596" stroke="#595959" stroke-width="2"/><path d="M596 315L585 307V323L596 315Z" fill="#595959"/>

  <g transform="translate(604 210)">
    <rect x="0" y="0" width="260" height="210" rx="20" fill="url(#panel)" stroke="#2a2a2a"/>
    <circle cx="28" cy="30" r="13" fill="#f6f6f6"/><text x="23" y="36" class="number">3</text>
    <text x="24" y="74" class="card-title">姿态 + 画质</text>
    <text x="24" y="108" class="mono">bird_visibility</text>
    <text x="24" y="136" class="mono">CLIPIQA+ / HyperIQA</text>
    <text x="24" y="164" class="card-small">头眼可见、焦点、主体质量</text>
    <rect x="24" y="178" width="88" height="24" rx="12" fill="#F05A5A"/><text x="43" y="195" class="tag">grade</text>
    <rect x="120" y="178" width="96" height="24" rx="12" fill="#D8D8D8"/><text x="137" y="195" class="tag">evidence</text>
  </g>

  <path d="M878 315H936" stroke="#595959" stroke-width="2"/><path d="M936 315L925 307V323L936 315Z" fill="#595959"/>

  <g transform="translate(944 210)">
    <rect x="0" y="0" width="272" height="210" rx="20" fill="url(#panel)" stroke="#2a2a2a"/>
    <circle cx="28" cy="30" r="13" fill="#f6f6f6"/><text x="23" y="36" class="number">4</text>
    <text x="24" y="74" class="card-title">鸟种识别</text>
    <text x="24" y="108" class="mono">DINOv3 ViT-L/16</text>
    <text x="24" y="136" class="mono">8-head ensemble</text>
    <text x="24" y="164" class="card-small">1535 类分类表与本地百科</text>
    <rect x="24" y="178" width="88" height="24" rx="12" fill="#74F69C"/><text x="40" y="195" class="tag">top-K</text>
    <rect x="120" y="178" width="112" height="24" rx="12" fill="#FFD45A"/><text x="137" y="195" class="tag">species</text>
  </g>

  <g transform="translate(64 455)">
    <rect width="1152" height="58" rx="18" fill="#101010" stroke="#282828"/>
    <text x="28" y="37" class="subtitle">结果进入 SQLite WAL：缩略图、分级、鸟种来源、场景共识、人工复核与导出清单都以同一业务口径读取。</text>
  </g>
</svg>
